<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Define mask for transparent server storage cutouts inside the cloud -->
    <mask id="storage-cutout">
      <!-- Everything white stays -->
      <rect width="100" height="100" fill="white" />
      <!-- Everything black is cut out (creates server slots and status indicators) -->
      <rect x="34" y="42" width="28" height="5" rx="2" fill="black" />
      <rect x="34" y="52" width="28" height="5" rx="2" fill="black" />
      <rect x="34" y="62" width="28" height="5" rx="2" fill="black" />
      <circle cx="68" cy="44.5" r="2.5" fill="black" />
      <circle cx="68" cy="54.5" r="2.5" fill="black" />
      <circle cx="68" cy="64.5" r="2.5" fill="black" />
    </mask>
  </defs>

  <!-- Solid Cloud base using the cutout mask - explicitly filled with Black #000000 -->
  <path 
    d="M78 44.5C75.2 31.4 63.8 21.5 50 21.5c-11 0-20.5 6.3-25.2 15.6C14.8 38.6 7 47.7 7 59.5c0 11.6 9.4 21 21 21h44c10.5 0 19-8.5 19-19c0-9.8-7.5-17.9-17-18.6z" 
    fill="#000000"
    mask="url(#storage-cutout)"
  />
</svg>
